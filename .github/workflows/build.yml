name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Easycuts.xcodeproj \
            -scheme Easycuts \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Easycuts.app Payload/
          zip -qry Easycuts.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Easycuts-ipa
          path: Easycuts.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Easycuts.ipa \
            --title "Easycuts (latest build)" \
            --notes "Unsigned IPA for sideloading with AltStore or Sideloadly." \
            --target "$GITHUB_SHA"
