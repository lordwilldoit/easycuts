name: Easycuts
options:
  bundleIdPrefix: com.easycuts
  deploymentTarget:
    iOS: "16.0"
targets:
  Easycuts:
    type: application
    platform: iOS
    sources:
      - Easycuts
    info:
      path: Easycuts/Info.plist
      properties:
        CFBundleDisplayName: Easycuts
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.easycuts.app
            CFBundleURLSchemes:
              - easycuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easycuts.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Easycuts:
    build:
      targets:
        Easycuts: all
